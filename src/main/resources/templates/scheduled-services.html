<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Service</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Services</h1>
    <table id="scheduled-services" class="table">
        <thead>
        <tr>
            <th>Car Model</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Technician</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="service: ${scheduledServices}">
            <td th:text="${service.carModel}"></td>
            <td th:text="${service.date ?: '-'}"></td>
            <td th:text="${service.time ?: '-'}"></td>
            <td th:text="${service.serviceStatus}"></td>
            <td th:text="${service.technician ?: '-'}"></td>
            <td>
                <a th:href="@{/services/{id}(id=${service.id})}">Details</a>
                <span th:if="${service.serviceStatus.name() == 'SCHEDULED' or service.serviceStatus.name() == 'ASSIGNED'}">
                    | <a th:href="@{/services/{id}/cancel(id=${service.id})}">Cancel</a>
                </span>
                <span th:if="${service.serviceStatus.name() == 'COMPLETED'}">
                    |
                    <button type="button" class="btn btn-link p-0 align-baseline"
                            data-toggle="modal"
                            th:attr="data-target=${'#documentBundleModal-' + service.id}">
                        Download documents
                    </button>
                </span>

                <div th:if="${service.serviceStatus.name() == 'COMPLETED'}"
                     class="modal fade"
                     th:id="${'documentBundleModal-' + service.id}"
                     tabindex="-1" role="dialog" aria-hidden="true">
                    <div class="modal-dialog" role="document">
                        <div class="modal-content">
                            <form method="POST"
                                  th:action="@{/services/{id}/documents/bundle(id=${service.id})}">
                                <div class="modal-header">
                                    <h5 class="modal-title">Download service documents</h5>
                                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                </div>
                                <div class="modal-body">
                                    <p>Select one or more documents to include in the TAR bundle.</p>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="files"
                                               value="service-overview.pdf"
                                               th:id="${'service-overview-' + service.id}" checked>
                                        <label class="form-check-label"
                                               th:for="${'service-overview-' + service.id}">
                                            Service overview
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="files"
                                               value="parts-detailed.pdf"
                                               th:id="${'parts-detailed-' + service.id}">
                                        <label class="form-check-label"
                                               th:for="${'parts-detailed-' + service.id}">
                                            Parts detailed
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="files"
                                               value="work-detailed.pdf"
                                               th:id="${'work-detailed-' + service.id}">
                                        <label class="form-check-label"
                                               th:for="${'work-detailed-' + service.id}">
                                            Work detailed
                                        </label>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                                    <button type="submit" class="btn btn-primary">Download TAR</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
