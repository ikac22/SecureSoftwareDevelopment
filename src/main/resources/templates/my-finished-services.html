<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My finished services</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h1>My finished services</h1>
            <p class="text-muted mb-0">Search completed service history and download service documents.</p>
        </div>
    </div>

    <form id="historySearchForm" class="card card-body mb-4">
        <div class="form-row">
            <div class="form-group col-md-3">
                <label for="historyCarModel">Car model</label>
                <input id="historyCarModel" class="form-control" maxlength="255"
                       placeholder="e.g. Ford Focus"/>
            </div>
            <div class="form-group col-md-3">
                <label for="historyServiceName">Performed service</label>
                <input id="historyServiceName" class="form-control" maxlength="255"
                       placeholder="e.g. Oil change"/>
            </div>
            <div class="form-group col-md-3">
                <label for="historyPartName">Used part</label>
                <input id="historyPartName" class="form-control" maxlength="255"
                       placeholder="e.g. Oil filter"/>
            </div>
            <div class="form-group col-md-3">
                <label for="historyTechnician">Technician</label>
                <input id="historyTechnician" class="form-control" maxlength="255"
                       placeholder="e.g. ana.anic"/>
            </div>
        </div>
        <div>
            <button type="submit" class="btn btn-primary">Search history</button>
            <button id="clearHistorySearch" type="button" class="btn btn-outline-secondary ml-2">Clear</button>
        </div>
    </form>

    <div id="historySearchError" class="alert alert-danger d-none" role="alert"></div>

    <table class="table table-hover" id="finished-services">
        <thead>
        <tr>
            <th>Service</th>
            <th>Work performed</th>
            <th>Completion</th>
            <th>Total price</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="historyResults">
        <tr>
            <td colspan="5" class="text-muted">Loading completed services…</td>
        </tr>
        </tbody>
    </table>

    <div class="modal fade" id="documentBundleModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <form id="documentBundleForm" method="POST">
                    <div class="modal-header">
                        <h5 class="modal-title">Download service documents</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <p id="documentBundleService" class="text-muted"></p>
                        <p>Select one or more documents to include in the TAR bundle.</p>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="files"
                                   value="service-overview.pdf" id="history-service-overview" checked>
                            <label class="form-check-label" for="history-service-overview">Service overview</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="files"
                                   value="parts-detailed.pdf" id="history-parts-detailed">
                            <label class="form-check-label" for="history-parts-detailed">Parts detailed</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="files"
                                   value="work-detailed.pdf" id="history-work-detailed">
                            <label class="form-check-label" for="history-work-detailed">Work detailed</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Download TAR</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const form = document.getElementById('historySearchForm');
            const results = document.getElementById('historyResults');
            const error = document.getElementById('historySearchError');
            const bundleForm = document.getElementById('documentBundleForm');
            const bundleService = document.getElementById('documentBundleService');

            function addFilter(filters, field, elementId) {
                const value = document.getElementById(elementId).value.trim();
                if (value) {
                    filters[field] = value;
                }
            }

            function requestBody() {
                const filters = {};
                addFilter(filters, 'carModel', 'historyCarModel');
                addFilter(filters, 'performedServices.name', 'historyServiceName');
                addFilter(filters, 'performedServices.usedParts.name', 'historyPartName');
                addFilter(filters, 'technician', 'historyTechnician');
                return {filters: filters};
            }

            function appendText(parent, value, className) {
                const element = document.createElement('div');
                if (className) {
                    element.className = className;
                }
                element.textContent = value || '-';
                parent.appendChild(element);
            }

            function serviceNames(service) {
                return (service.performedServices || [])
                    .map(function (item) { return item.name; })
                    .filter(Boolean)
                    .join(', ') || '-';
            }

            function partNames(service) {
                const names = [];
                (service.performedServices || []).forEach(function (item) {
                    (item.usedParts || []).forEach(function (part) {
                        if (part.name && names.indexOf(part.name) < 0) {
                            names.push(part.name);
                        }
                    });
                });
                return names.join(', ') || '-';
            }

            function renderHistory(items) {
                results.textContent = '';
                if (!items.length) {
                    const row = document.createElement('tr');
                    const cell = document.createElement('td');
                    cell.colSpan = 5;
                    cell.className = 'text-muted';
                    cell.textContent = 'No completed services match the selected filters.';
                    row.appendChild(cell);
                    results.appendChild(row);
                    return;
                }

                items.forEach(function (service) {
                    const row = document.createElement('tr');

                    const serviceCell = document.createElement('td');
                    appendText(serviceCell, service.carModel, 'font-weight-bold');
                    appendText(serviceCell, service.serviceDescription, 'small text-muted');
                    appendText(serviceCell,
                        service.serviceDate ? service.serviceDate + (service.serviceTime ? ' at ' + service.serviceTime : '') : '-',
                        'small');
                    row.appendChild(serviceCell);

                    const workCell = document.createElement('td');
                    appendText(workCell, serviceNames(service), 'font-weight-bold');
                    appendText(workCell, 'Parts: ' + partNames(service), 'small text-muted');
                    row.appendChild(workCell);

                    const completionCell = document.createElement('td');
                    appendText(completionCell, service.completedAt || '-', 'small');
                    appendText(completionCell, 'Technician: ' + (service.technician || '-'), 'small text-muted');
                    row.appendChild(completionCell);

                    const totalCell = document.createElement('td');
                    const total = service.totalPrice == null ? '0.00' : Number(service.totalPrice).toFixed(2);
                    appendText(totalCell, total, 'font-weight-bold');
                    row.appendChild(totalCell);

                    const actionsCell = document.createElement('td');
                    const details = document.createElement('a');
                    details.href = '/services/' + encodeURIComponent(service.serviceId);
                    details.textContent = 'Details';
                    actionsCell.appendChild(details);

                    const separator = document.createTextNode(' | ');
                    actionsCell.appendChild(separator);

                    const download = document.createElement('button');
                    download.type = 'button';
                    download.className = 'btn btn-link p-0 align-baseline';
                    download.textContent = 'Download documents';
                    download.addEventListener('click', function () {
                        bundleForm.action = '/services/' + encodeURIComponent(service.serviceId) + '/documents/bundle';
                        bundleService.textContent = 'Service #' + service.serviceId + ' — ' + (service.carModel || '');
                        $('#documentBundleModal').modal('show');
                    });
                    actionsCell.appendChild(download);
                    row.appendChild(actionsCell);

                    results.appendChild(row);
                });
            }

            async function searchHistory() {
                error.classList.add('d-none');
                try {
                    const response = await fetch('/api/my/service-history/search', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(requestBody())
                    });
                    if (!response.ok) {
                        throw new Error('History search failed with status ' + response.status);
                    }
                    renderHistory(await response.json());
                } catch (exception) {
                    results.textContent = '';
                    error.textContent = exception.message || 'Could not load service history.';
                    error.classList.remove('d-none');
                }
            }

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                searchHistory();
            });

            document.getElementById('clearHistorySearch').addEventListener('click', function () {
                form.reset();
                searchHistory();
            });

            searchHistory();
        }());
    </script>
</div>
</body>
</html>
