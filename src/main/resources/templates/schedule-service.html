<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Schedule service</title>
</head>
<body>
<div layout:fragment="content">
    <form action="/schedule-service" method="POST">
        <div class="form-group">
            <label for="carModel">Car Model</label>
            <input type="text" id="carModel" name="carModel" class="form-control" required/>
        </div>
        <div class="form-group">
            <label for="description">Service description</label>
            <textarea id="description" name="description" class="form-control" maxlength="1000" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Schedule</button>
    </form>
</div>
</body>
</html>
