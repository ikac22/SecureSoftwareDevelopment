name: CWE-94 snapshot experiment

on:
  workflow_dispatch:
  push:
    branches:
      - attack/cwe-94-loyalty-spel
  pull_request:
    branches:
      - master
    paths:
      - 'attacks/cwe-94/**'
      - 'src/main/java/com/zuehlke/securesoftwaredevelopment/service/ServicePricingPolicyEvaluator.java'
      - 'src/main/resources/pricing/*.spel'
      - 'src/test/java/com/zuehlke/securesoftwaredevelopment/controller/Cwe94ExperimentTests.java'
      - 'src/test/java/com/zuehlke/securesoftwaredevelopment/service/ServicePricingPolicyEvaluatorTests.java'
      - '.github/workflows/cwe-94-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: cwe-94-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-test:
    name: Vulnerable vs mitigated snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CWE94_VULNERABLE_TAG: ci-cwe-94-vulnerable-${{ github.run_id }}
      CWE94_MITIGATED_TAG: ci-cwe-94-mitigated-${{ github.run_id }}
      CWE94_MITIGATED_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Configure Git identity for local snapshot tags
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make scripts executable
        run: chmod +x mvnw attacks/cwe-94/run-attack.sh attacks/cwe-94/tag-snapshots.sh

      - name: Create local experiment snapshot tags
        run: bash attacks/cwe-94/tag-snapshots.sh

      - name: Run CWE-94 snapshot comparison
        run: bash attacks/cwe-94/run-attack.sh all

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cwe-94-snapshot-evidence-${{ github.run_id }}
          path: |
            attacks/cwe-94/evidence/vulnerable/
            attacks/cwe-94/evidence/mitigated/
          if-no-files-found: warn
