name: CWE-943 snapshot experiment

on:
  workflow_dispatch:
  push:
    branches:
      - attack/cwe-943-nosql-service-history
  pull_request:
    branches:
      - master
    paths:
      - 'attacks/cwe-943/**'
      - 'src/main/java/com/zuehlke/securesoftwaredevelopment/controller/ServiceHistoryController.java'
      - 'src/main/java/com/zuehlke/securesoftwaredevelopment/repository/ServiceHistorySearchRepository.java'
      - 'src/main/java/com/zuehlke/securesoftwaredevelopment/service/ServiceHistoryService.java'
      - 'src/test/java/com/zuehlke/securesoftwaredevelopment/controller/Cwe943ExperimentTests.java'
      - '.github/workflows/cwe-943-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: cwe-943-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-test:
    name: Vulnerable vs mitigated snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CWE943_VULNERABLE_TAG: ci-cwe-943-vulnerable-${{ github.run_id }}
      CWE943_MITIGATED_TAG: ci-cwe-943-mitigated-${{ github.run_id }}
      CWE943_MITIGATED_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Make scripts executable
        run: chmod +x mvnw attacks/cwe-943/run-attack.sh attacks/cwe-943/tag-snapshots.sh

      - name: Create local experiment snapshot tags
        run: bash attacks/cwe-943/tag-snapshots.sh

      - name: Run CWE-943 snapshot comparison
        run: bash attacks/cwe-943/run-attack.sh all

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cwe-943-snapshot-evidence-${{ github.run_id }}
          path: |
            attacks/cwe-943/evidence/vulnerable/
            attacks/cwe-943/evidence/mitigated/
          if-no-files-found: warn
